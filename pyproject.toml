[project]
name = "zshrc"
version = "0.1.0"
description = "my zsh shell dot repo"
requires-python = ">=3.14"
dependencies = [
    "rich",
    "typer",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
reportUnusedImport = "warning"
extraPaths = [
    "lib",
]

[tool.ruff.lint]
# Q = flake8-quotes (surgical string fixing)
# I = isort (import sorting)
# F401 = unused imports
select = ["Q", "I", "F401"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
docstring-quotes = "single"
multiline-quotes = "single"

[tool.ruff.format]
quote-style = "single"
